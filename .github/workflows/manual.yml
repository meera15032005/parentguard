name: Build ParentGuard APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o ParentGuard_GitHub_Ready.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Configure Android project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("project")
          root_gradle = root / "build.gradle.kts"

          # Add Compose compiler plugin to root build file
          text = root_gradle.read_text()

          compose_plugin = '    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false'

          if "org.jetbrains.kotlin.plugin.compose" not in text:
              marker = '    id("org.jetbrains.kotlin.android") version "2.0.21" apply false'
              text = text.replace(marker, marker + "\n" + compose_plugin)

          root_gradle.write_text(text)

          # Configure both Android modules
          for module in ["parent", "child"]:
              file = root / module / "build.gradle.kts"
              text = file.read_text()

              # Apply Compose compiler plugin
              if "org.jetbrains.kotlin.plugin.compose" not in text:
                  marker = '    id("org.jetbrains.kotlin.android")'
                  text = text.replace(
                      marker,
                      marker + '\n    id("org.jetbrains.kotlin.plugin.compose")'
                  )

              # Java/Kotlin 17
              if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
                  text += '''

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          '''

              file.write_text(text)

          # AndroidX
          props = root / "gradle.properties"
          existing = props.read_text() if props.exists() else ""

          if "android.useAndroidX=true" not in existing:
              existing += "\nandroid.useAndroidX=true\n"

          if "android.enableJetifier=true" not in existing:
              existing += "android.enableJetifier=true\n"

          props.write_text(existing)

          print("AndroidX, Java 17 and Compose compiler configured.")
          PY

      - name: Build Parent APK
        working-directory: project
        run: gradle :parent:assembleDebug

      - name: Build Child APK
        working-directory: project
        run:
