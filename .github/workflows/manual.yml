name: Build ParentGuard APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o ParentGuard_GitHub_Ready.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Fix Kotlin and Compose compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("project")

          # Use Kotlin 1.9.25 for compatibility with the
          # Compose setup in this starter project.
          gradle = root / "build.gradle.kts"
          text = gradle.read_text()
          text = text.replace(
              'org.jetbrains.kotlin.android") version "2.0.21"',
              'org.jetbrains.kotlin.android") version "1.9.25"'
          )
          gradle.write_text(text)

          # AndroidX
          props = root / "gradle.properties"
          old = props.read_text() if props.exists() else ""

          if "android.useAndroidX=true" not in old:
              old += "\nandroid.useAndroidX=true\n"

          if "android.enableJetifier=true" not in old:
              old += "android.enableJetifier=true\n"

          props.write_text(old)

          # Configure both modules for Java/Kotlin 17
          for module in ["parent", "child"]:
              f = root / module / "build.gradle.kts"
              s = f.read_text()

              if "sourceCompatibility" not in s:
                  s += """

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.15"
              }
          }
          """

              if "jvmTarget = \"17\"" not in s:
                  s += """

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """

              f.write_text(s)

          print("Kotlin 1.9.25 + Compose 1.5.15 configured.")
          PY

      - name: Build Parent APK
        working-directory: project
        run: gradle :parent:assembleDebug

      - name: Build Child APK
        working-directory: project
        run: gradle :child:assembleDebug

      - name: Check APK files
        run: |
          echo "=== Parent APK ==="
          find project/parent/build/outputs/apk -name "*.apk" -print

          echo "=== Child APK ==="
          find project/child/build/outputs/apk -name "*.apk" -print

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ParentGuard-APKs
          path: |
            project/parent/build/outputs/apk/debug/*.apk
            project/child/build/outputs/apk/debug/*.apk
          if-no-files-found: error
