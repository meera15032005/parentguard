name: Build ParentGuard APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o ParentGuard_GitHub_Ready.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Configure Android project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("project")

          # Enable AndroidX and Jetifier
          props = root / "gradle.properties"
          existing = props.read_text() if props.exists() else ""

          if "android.useAndroidX=true" not in existing:
              existing += "\nandroid.useAndroidX=true\n"

          if "android.enableJetifier=true" not in existing:
              existing += "android.enableJetifier=true\n"

          props.write_text(existing)

          # Configure Java/Kotlin 17 for both Android modules
          for module in ["parent", "child"]:
              file = root / module / "build.gradle.kts"
              text = file.read_text()

              if "compileOptions" not in text:
                  text += """

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          """

              if "kotlinOptions.jvmTarget" not in text:
                  text += """

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          """

              file.write_text(text)

          print("AndroidX, Java 17 and Kotlin 17 configured.")
          PY

      - name: Build Parent APK
        working-directory: project
        run: gradle :parent:assembleDebug

      - name: Build Child APK
        working-directory: project
        run: gradle :child:assembleDebug

      - name: Check generated APKs
        run: |
          echo "Parent APK:"
          find project/parent/build/outputs/apk -type f -name "*.apk" -print

          echo "Child APK:"
          find project/child/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ParentGuard-APKs
          path: |
            project/parent/build/outputs/apk/debug/*.apk
            project/child/build/outputs/apk/debug/*.apk
          if-no-files-found: error
