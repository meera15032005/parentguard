name: Build ParentGuard APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q ParentGuard_GitHub_Ready.zip -d project
          if [ -d project/ParentGuard_fixed ]; then
            shopt -s dotglob
            mv project/ParentGuard_fixed/* project/
            rmdir project/ParentGuard_fixed
          fi
          test -f project/build.gradle.kts
          test -f project/settings.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Build Parent APK
        working-directory: project
        run: gradle :parent:assembleDebug --stacktrace

      - name: Build Child APK
        working-directory: project
        run: gradle :child:assembleDebug --stacktrace

      - name: Check APK files
        run: |
          test -f project/parent/build/outputs/apk/debug/parent-debug.apk
          test -f project/child/build/outputs/apk/debug/child-debug.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ParentGuard-APKs
          path: |
            project/parent/build/outputs/apk/debug/*.apk
            project/child/build/outputs/apk/debug/*.apk
            
